services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    command:  >
      sh -c "uv run --no-sync alembic upgrade head && uv run --no-sync uvicorn src.app:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/db
      WEBHOOK_URL: ${WEBHOOK_URL}
    volumes:
      - ./data/log/app:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17.6
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d db"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  db_data: